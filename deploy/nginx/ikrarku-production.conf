# ikrarku.id — Nginx reverse proxy ke container production (127.0.0.1:5181).
# Pasang di /etc/nginx/sites-available/ikrarku-production lalu jalankan
#   certbot --nginx -d ikrarku.id -d www.ikrarku.id
# Certbot menambahkan blok listen 443 + redirect HTTP->HTTPS otomatis.

# www -> domain utama (satu origin saja, sesuai CLIENT_ORIGIN).
server {
    listen 80;
    server_name www.ikrarku.id;
    return 301 https://ikrarku.id$request_uri;
}

server {
    listen 80;
    server_name ikrarku.id;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
