name: Staging Check

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa
        env:
          VITE_API_URL: /api
      - run: docker build --build-arg VITE_API_URL=/api -t ikrarku-sites:staging-check .

